<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Data Types</title>
</head>

<body>
    <h1>JavaScript Operators</h1>
    <script>
        // example of assignment operators
        const x = 40;
        const y = 25;
        const p = 2;
        // const z = x + y; // 75
        // const z = x - y; // 25
        // const z = x * y; // 1250
        // const z = x / y; // 2
        // const z = x % y; // 0
        const z = x ** p; // 1600
        console.log(z);

        // comparison operator
        const numberx = 100;
        const numbery = "100";
        // const compared = numberx == numbery; // true
        const compared = numberx === numbery; // false
        console.log(compared);

        const username1 = "Prangon";
        const username2 = "prangon";
        // const comparedname = username1 == username2; // false
        const comparedname = username1 !== username2; // true
        console.log(comparedname);

        // relational operator
        const a = 23;
        const b = 40;
        // console.log(a > b); // false
        console.log(a < b); // true
        // console.log(a <= b); // true
        console.log(a >= b); // false

        // logical operator
        console.log(100 > 99 && 99 > 100) // false
        console.log(100 < 99 || 99 < 100) // true
        console.log(false) // false
        console.log(!false) // true

    </script>
</body>

</html>
