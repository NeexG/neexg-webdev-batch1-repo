<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Data Types</title>
</head>

<body>
    <h1>JavaScript</h1>
    <script>
        // const, let, var
        // let and const are used for declaring variables
        // var is used for declaring variables

        var number = 10;
        // var/let/const = keyword, number = variablename, = assignment operator, 10 = value;

        var x = 10;
        var x = 11;
        var x = "Rakibul";
        console.log(x);

        let y = 10;
        y = 11;
        y = "Rakibul";
        console.log(y);

        const z = 10;
        // z = 11;
        console.log(z);

    </script>
</body>

</html>
